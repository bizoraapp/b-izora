# Bizora app — Netlify build.
# Publishes ONLY the files the app needs at runtime. Everything else in this
# repository (CLAUDE.md, docs/, qa/, README.md, DEVELOPER.md, old builds) is
# never published. If the app needs a new runtime file, add it here AND to
# the service-worker APP_SHELL, and say so in the pull request.
[build]
  publish = "dist"
  command = "rm -rf dist && mkdir -p dist/icons && cp index.html service-worker.js manifest.json offline.html dist/ && cp icons/*.png dist/icons/ && ls -R dist"
